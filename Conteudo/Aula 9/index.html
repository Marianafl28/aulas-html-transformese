<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões</title>

    <style>
        .testebtn{
            border: 4px solid #000;
            padding: 30px 80px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            font-size: 20px;
            border-radius: 10px;
            background-color: blueviolet;
            color: azure;
            cursor: pointer;
        }

        .testebtn:hover{
            background-color: rgb(29, 233, 11);
            transition: 0.5s;
        }
    </style>

</head>
<body>
    <h1>utilizando Botões</h1>
    <p>Utilizando botões em Html</p>

    <button>Clique Agora</button>

<hr>

    <p>Adicionando estilo no botão:</p>
    <button class="testebtn">Clique aqui</button>


    <p>Adicionando botão não clicavel:</p>
    <button disabled>Clique aqui</button>

<hr>

    <p>Botão com Java Script:</p>
    <button onclick="alert('A turma SP08 é supimpa')">Clique aqui</button>

<hr>

<h4>Botões em formulários</h4>
<p>Exemplo de tipos de botões:</p>

<form action="">
    <label>Primeiro nome</label>
    <input type="text">
    <button type="submit">Enviar</button>
    <button type="reset">Limpar Form</button>
</form>

</body>
</html>
